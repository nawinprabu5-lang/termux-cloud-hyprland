# ╔═══════════════════════════════════════════════════════════════════╗
# ║        Termux Cloud Hyprland Configuration (Midnight Rice)        ║
# ╚═══════════════════════════════════════════════════════════════════╝

# --- Display & Monitors ---
# Virtual headless monitor for cloud rendering & WayVNC streaming
monitor = HEADLESS-1, 1920x1080@60, 0x0, 1
# Fallback wildcard for dynamic resolution adaptation
monitor = , preferred, auto, 1

# --- Autostart Applications ---
exec-once = waybar
exec-once = swaybg -c '#0b0f19'
exec-once = kitty

# --- Input & Gestures ---
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# --- General Appearance ---
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    
    # Midnight Cyan & Neon Purple gradient border
    col.active_border = rgba(00f5d4ee) rgba(7b2cbfee) 45deg
    col.inactive_border = rgba(1e293baa)

    layout = dwindle
    allow_tearing = false
}

# --- Window Decoration & Effects ---
decoration {
    rounding = 10

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }

    active_opacity = 0.95
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0
}

# --- Fluid Animations ---
animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.1

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 8, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, myBezier, slide
}

# --- Layout Options ---
dwindle {
    pseudotile = yes
    preserve_split = yes
}

master {
    new_status = master
}

# --- Keybindings ---
$mainMod = SUPER

# Applications
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, D, exec, wofi --show drun --prompt "Search Apps..."
bind = $mainMod, B, exec, firefox
bind = $mainMod, E, exec, kitty -e ranger
bind = $mainMod, T, exec, kitty -e htop

# Window Control
bind = $mainMod, Q, killactive,
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Focus Movement (Vim & Arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

# Move Active Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# Move/Resize Windows with Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
