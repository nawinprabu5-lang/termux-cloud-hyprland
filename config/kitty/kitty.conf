# Kitty Terminal Configuration (Midnight Neon Theme)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Window Layout
remember_window_size  no
initial_window_width  800
initial_window_height 500
window_padding_width  8
background_opacity    0.85
dynamic_background_opacity yes

# Cursor
cursor_shape          beam
cursor_beam_thickness 1.5

# Color Palette
background            #0b0f19
foreground            #e2e8f0
selection_background  #7b2cbf
selection_foreground  #00f5d4

# Normal colors
color0   #1e293b
color1   #f87171
color2   #34d399
color3   #fbbf24
color4   #38bdf8
color5   #c084fc
color6   #00f5d4
color7   #cbd5e1

# Bright colors
color8   #64748b
color9   #ef4444
color10  #10b981
color11  #f59e0b
color12  #0ea5e9
color13  #a855f7
color14  #06b6d4
color15  #f8fafc

# Shell integration
shell /bin/zsh
